<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VGC Team Preview Analyzer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>VGC Tactician</h1>
    <button id="btn-reset">Reset</button>
  </header>

  <main>
    <section id="section-my-team" class="card">
      <h2>1. Importar mi Equipo</h2>
      <textarea id="input-pokepaste" placeholder="Pega tu Poképaste de Showdown aquí..."></textarea>
      <button id="btn-import" class="btn-primary">Cargar Equipo</button>
      <div id="my-team-preview" class="team-grid hidden"></div>
    </section>

    <section id="section-enemy-team" class="card hidden">
      <h2>2. Equipo Rival</h2>
      <div class="enemy-inputs">
        <input type="text" class="enemy-search" placeholder="Pokémon 1..." data-index="0">
        <input type="text" class="enemy-search" placeholder="Pokémon 2..." data-index="1">
        <input type="text" class="enemy-search" placeholder="Pokémon 3..." data-index="2">
        <input type="text" class="enemy-search" placeholder="Pokémon 4..." data-index="3">
        <input type="text" class="enemy-search" placeholder="Pokémon 5..." data-index="4">
        <input type="text" class="enemy-search" placeholder="Pokémon 6..." data-index="5">
      </div>
      <div id="enemy-team-preview" class="team-grid"></div>
      <button id="btn-analyze" class="btn-primary" disabled>Analizar Matchup</button>
    </section>

    <section id="section-dashboard" class="hidden">
      <nav class="tabs">
        <button class="tab-btn active" data-target="tab-leads">Leads & Picks</button>
        <button class="tab-btn" data-target="tab-speed">Speed Tiers</button>
        <button class="tab-btn" data-target="tab-matrix">Matriz</button>
      </nav>

      <div id="tab-leads" class="tab-content active">
        <div class="recommendation-card success">
          <h3>Lead Óptimo Recomendado</h3>
          <p id="optimal-lead-text">Calculando...</p>
        </div>
        <div class="recommendation-card danger">
          <h3>Amenaza Principal Rival</h3>
          <p id="threat-text">Calculando...</p>
        </div>
      </div>

      <div id="tab-speed" class="tab-content">
        <div class="speed-controls">
          <label><input type="checkbox" id="toggle-tailwind-me"> Mi Tailwind</label>
          <label><input type="checkbox" id="toggle-tailwind-enemy"> Su Tailwind</label>
        </div>
        <ul id="speed-tier-list" class="timeline"></ul>
      </div>

      <div id="tab-matrix" class="tab-content">
        <p class="hint">Toca un Pokémon para simular su Terastalización probable.</p>
        <div id="matchup-grid" class="matchup-grid"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
