<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PokéDoubles Preview</title>
  <meta
    name="description"
    content="Landing-app táctica mobile-first para team preview competitivo Pokémon dobles 4v4."
  />
  <meta name="theme-color" content="#0b1017" />

  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <h1 class="hero__title">Champions Meta</h1>
      <p class="hero__sub">Team Preview · Dobles 4v4</p>
    </div>
    <button class="btn-icon theme-toggle" id="themeToggle" aria-label="Cambiar tema">
      <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
    </button>
  </header>

  <main class="main">
    <section class="team-section" id="myTeamSection" aria-label="Mi equipo">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title__dot dot--my"></span>Mi equipo
        </h2>
        <div class="section-actions">
          <button class="btn btn--ghost btn--sm" id="saveTeamBtn">Guardar</button>
          <button class="btn btn--ghost btn--sm btn--danger" id="clearMyTeamBtn">Limpiar</button>
        </div>
      </div>
      <div class="team-grid" id="myTeamGrid" role="list"></div>
    </section>

    <section class="team-section" id="rivalTeamSection" aria-label="Equipo rival">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title__dot dot--rival"></span>Equipo rival
        </h2>
        <div class="section-actions">
          <button class="btn btn--ghost btn--sm btn--danger" id="clearRivalTeamBtn">Limpiar</button>
        </div>
      </div>
      <div class="team-grid" id="rivalTeamGrid" role="list"></div>
    </section>

    <section class="analysis-section" id="matchupOverviewSection" aria-label="Visión general del matchup">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title__dot dot--analysis"></span>Visión general del matchup
        </h2>
      </div>
      <div class="analysis-panel" id="matchupOverview"></div>
    </section>

    <section class="analysis-section" id="tacticalReadSection" aria-label="Lectura táctica básica">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title__dot dot--tactical"></span>Lectura táctica básica
        </h2>
      </div>
      <div class="analysis-panel" id="tacticalRead"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Champions Meta · Fase 2 · Datos: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
