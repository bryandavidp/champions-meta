<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VGC Tactical Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero">
        <h1>VGC TACTICAL LINK</h1>
        <p>Análisis en 90 segundos</p>
    </header>

    <main id="builder-view">
        <section class="team-section" id="my-team-section">
            <h2>Mi Equipo <span class="counter" id="my-counter">0/6</span></h2>
            <div class="slots-grid" id="my-slots"></div>
        </section>

        <section class="team-section" id="enemy-team-section">
            <h2>Equipo Rival <span class="counter" id="enemy-counter">0/6</span></h2>
            <div class="slots-grid" id="enemy-slots"></div>
        </section>

        <button id="analyze-btn" class="cta-btn" disabled>Analizar Matchup</button>
    </main>

    <main id="results-view" class="hidden">
        <button id="back-btn" class="secondary-btn">← Volver al setup</button>
        
        <section class="result-module">
            <h2>Recomendación Táctica</h2>
            <div class="tactical-card lead-card">
                <h3>Vanguardia (Leads)</h3>
                <div id="lead-result" class="pokemon-row"></div>
                <p id="lead-reason" class="reasoning"></p>
            </div>
            
            <div class="tactical-card core-card">
                <h3>Backline (Resto del Core)</h3>
                <div id="core-result" class="pokemon-row"></div>
                <p id="core-reason" class="reasoning"></p>
            </div>
        </section>

        <section class="result-module">
            <h2>Radar de Amenazas</h2>
            <div id="threat-list" class="threat-grid"></div>
        </section>
    </main>

    <div id="search-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <input type="text" id="pokemon-search" placeholder="Buscar Pokémon..." autocomplete="off">
                <button id="close-modal">X</button>
            </div>
            <ul id="search-results" class="results-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
